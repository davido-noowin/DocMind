services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build: ./services/core-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: docmind
      DB_USER: docmind
      DB_PASSWORD: docmind
    ports:
      - "8080:8080"

  ai-service:
    build: ./services/ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: docmind
      DB_USER: docmind
      DB_PASSWORD: docmind
      MONGO_URI: mongodb://mongo:27017/docmind
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - core-api
      - ai-service
    environment:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:8080
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mongo_data:
